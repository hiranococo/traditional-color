<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>传统色卡</title>
  <style>
    :root {
      --primary: #0066cc;
      --primary-focus: #0071e3;
      --primary-on-dark: #2997ff;
      --canvas: #ffffff;
      --canvas-parchment: #f5f5f7;
      --surface-pearl: #fafafc;
      --surface-tile-1: #272729;
      --surface-tile-2: #2a2a2c;
      --ink: #1d1d1f;
      --body-muted: #cccccc;
      --hairline: #e0e0e0;
      --divider-soft: #f0f0f0;
      --section-padding: 80px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--canvas-parchment);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .sub-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      backdrop-filter: saturate(180%) blur(20px);
      background: rgba(245, 245, 247, 0.8);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .sub-nav-inner {
      width: min(1440px, 100%);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
    }

    .sub-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .button-primary,
    .button-secondary {
      border-radius: 9999px;
      padding: 11px 22px;
      font-size: 17px;
      line-height: 1;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .button-primary:active,
    .button-secondary:active {
      transform: scale(0.95);
    }

    .button-primary:focus-visible,
    .button-secondary:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .button-primary {
      background: var(--primary);
      color: #fff;
    }

    .button-secondary {
      background: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }

    .sort-select {
      height: 44px;
      min-width: 8.5rem;
      padding: 0 16px;
      border-radius: 9999px;
      font-size: 17px;
      line-height: 1;
      font-family: inherit;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .sort-select:active {
      transform: scale(0.95);
    }

    .sort-select:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    main {
      margin-top: 52px;
    }

    .catalog-section {
      background: var(--canvas-parchment);
      padding: 64px 24px 80px;
    }

    .catalog-inner {
      width: min(1440px, 100%);
      margin: 0 auto;
    }

    .catalog-head {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      width: 100%;
      min-width: 0;
    }

    .catalog-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .filter-wrap {
      position: relative;
    }

    .filter-btn.is-active {
      background: rgba(0, 102, 204, 0.08);
    }

    .filter-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 50;
      min-width: 220px;
      max-width: min(320px, calc(100vw - 32px));
      padding: 14px 16px 16px;
      background: var(--canvas);
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .filter-panel[hidden] {
      display: none !important;
    }

    .filter-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .filter-swatch {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-sizing: border-box;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      flex-shrink: 0;
    }

    .filter-swatch:hover {
      transform: scale(1.06);
    }

    .filter-swatch:active {
      transform: scale(0.95);
    }

    .filter-swatch:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .filter-swatch--light {
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .filter-swatch.is-selected {
      box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--primary);
    }

    .filter-swatch.filter-swatch--light.is-selected {
      box-shadow: 0 0 0 2px var(--primary), 0 0 0 4px var(--primary);
    }

    .filter-panel-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .filter-panel-action {
      flex: 1;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.2;
      cursor: pointer;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .filter-panel-action:hover {
      opacity: 0.92;
    }

    .filter-panel-action:active {
      transform: scale(0.98);
    }

    .filter-panel-action:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .filter-panel-action--ghost {
      background: transparent;
      color: var(--primary);
    }

    .search-input {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 340px;
      width: 100%;
      height: 44px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 0 20px;
      font-size: 17px;
      color: var(--ink);
      background: var(--canvas);
    }

    .search-input:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0 0 10px;
      display: grid;
      gap: 8px;
    }

    .card-preview {
      aspect-ratio: 2 / 1;
      border-radius: 10px;
      box-shadow: rgba(0, 0, 0, 0.2) 2px 3px 12px 0;
    }

    .card-name {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.37px;
      line-height: 1.24;
    }

    .card-hex {
      margin: 0;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.37px;
      line-height: 1.47;
      color: #333;
      font-family: Consolas, "Courier New", monospace;
    }

    .footer {
      background: var(--canvas-parchment);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding: 64px 24px;
      color: #7a7a7a;
      font-size: 12px;
    }

    .footer-inner {
      width: min(1440px, 100%);
      margin: 0 auto;
      line-height: 1.7;
    }

    @media (max-width: 1068px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 833px) {
      :root {
        --section-padding: 56px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .button-primary,
      .button-secondary {
        padding: 10px 18px;
        font-size: 14px;
      }

      .sort-select {
        height: 42px;
        padding: 0 14px;
        font-size: 14px;
      }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sub-nav">
    <div class="sub-nav-inner">
      <div class="sub-nav-actions">
        <button id="go-catalog-btn" class="button-primary" type="button">查看色库</button>
      </div>
    </div>
  </div>

  <main>
    <section class="catalog-section" id="catalog">
      <div class="catalog-inner">
        <div class="catalog-head">
          <input id="search-input" class="search-input" type="search" placeholder="搜索色名或 HEX">
          <div class="catalog-toolbar-right">
            <div class="filter-wrap" id="filter-wrap">
              <button
                id="filter-btn"
                class="button-secondary filter-btn"
                type="button"
                aria-expanded="false"
                aria-haspopup="true"
                aria-controls="filter-panel"
              >
                筛选
              </button>
              <div id="filter-panel" class="filter-panel" role="region" aria-label="按色系筛选" hidden>
                <div class="filter-swatches" id="filter-swatches" role="group" aria-label="色系多选"></div>
                <div class="filter-panel-footer">
                  <button type="button" id="filter-select-all" class="filter-panel-action">全选</button>
                  <button type="button" id="filter-clear-all" class="filter-panel-action filter-panel-action--ghost">
                    清空选项
                  </button>
                </div>
              </div>
            </div>
            <select id="sort-select" class="sort-select" aria-label="排序">
              <option value="default">默认顺序</option>
              <option value="light-to-dark">由浅至深</option>
              <option value="dark-to-light">由深至浅</option>
            </select>
          </div>
        </div>
        <section class="grid" id="color-grid"></section>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      传统色卡 · Apple 风格设计实验站点。<br>
      色卡数据来自 `colors.json`，可直接编辑该文件后刷新页面。
    </div>
  </footer>

  <script>
    const DATA_FILE = "colors.json";
    let colors = [];
    let searchKeyword = "";
    /** @type {"default" | "light-to-dark" | "dark-to-light"} */
    let sortMode = "default";

    const FAMILIES = [
      { id: "red", label: "红", swatch: "#c41e3a" },
      { id: "orange", label: "橙", swatch: "#e07020" },
      { id: "yellow", label: "黄", swatch: "#e6b800" },
      { id: "green", label: "绿", swatch: "#2d8640" },
      { id: "cyan", label: "青", swatch: "#0d9488" },
      { id: "blue", label: "蓝", swatch: "#2563eb" },
      { id: "purple", label: "紫", swatch: "#6d28d9" },
      { id: "pink", label: "粉", swatch: "#db2777" },
      { id: "brown", label: "棕", swatch: "#7c4a32" },
      { id: "gray", label: "灰", swatch: "#9ca3af" },
      { id: "white", label: "白", swatch: "#f5f5f5", light: true },
      { id: "black", label: "黑", swatch: "#1a1a1a" },
    ];

    const selectedFamilies = new Set();

    const searchInput = document.getElementById("search-input");
    const colorGrid = document.getElementById("color-grid");
    const catalogSection = document.getElementById("catalog");
    const filterWrap = document.getElementById("filter-wrap");
    const filterBtn = document.getElementById("filter-btn");
    const filterPanel = document.getElementById("filter-panel");
    const filterSwatches = document.getElementById("filter-swatches");

    function matchesSearch(color) {
      if (!searchKeyword) return true;
      const text = `${color.name} ${color.hex}`.toLowerCase();
      return text.includes(searchKeyword);
    }

    function parseHexToRgb(hex) {
      let h = String(hex).trim().replace("#", "");
      if (h.length === 3) {
        h = h.split("").map((c) => c + c).join("");
      }
      const n = parseInt(h, 16);
      if (!Number.isFinite(n) || h.length !== 6) return null;
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function rgbToHsv(r, g, b) {
      const rn = r / 255;
      const gn = g / 255;
      const bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === rn) {
          h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6;
        } else if (max === gn) {
          h = ((bn - rn) / d + 2) / 6;
        } else {
          h = ((rn - gn) / d + 4) / 6;
        }
      }
      h *= 360;
      const s = max === 0 ? 0 : d / max;
      const v = max;
      return { h, s, v };
    }

    /** 将 HEX 归入与筛选色圈一致的色系 id */
    function hexToFamily(hex) {
      const rgb = parseHexToRgb(hex);
      if (!rgb) return null;
      const { h, s, v } = rgbToHsv(rgb.r, rgb.g, rgb.b);
      if (v < 0.1) return "black";
      if (s < 0.08 && v > 0.9) return "white";
      if (s < 0.12) return "gray";
      if (h >= 15 && h <= 48 && s > 0.18 && v < 0.62 && v > 0.1) return "brown";
      if (h < 22 || h >= 340) return "red";
      if (h < 48) return "orange";
      if (h < 72) return "yellow";
      if (h < 158) return "green";
      if (h < 185) return "cyan";
      if (h < 258) return "blue";
      if (h < 292) return "purple";
      if (h < 340) return "pink";
      return "red";
    }

    function matchesFilter(color) {
      if (selectedFamilies.size === 0) return true;
      const fam = hexToFamily(color.hex);
      return fam !== null && selectedFamilies.has(fam);
    }

    /** WCAG 2.1 relative luminance (sRGB), 0–1 */
    function relativeLuminance(hex) {
      const rgb = parseHexToRgb(hex);
      if (!rgb) return 0;
      const linear = [rgb.r, rgb.g, rgb.b].map((c) => {
        const x = c / 255;
        return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4;
      });
      return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    }

    function renderColors() {
      const filtered = colors.filter((c) => matchesSearch(c) && matchesFilter(c));
      const rows =
        sortMode === "default"
          ? filtered.slice()
          : filtered.slice().sort((a, b) => {
              const la = relativeLuminance(a.hex);
              const lb = relativeLuminance(b.hex);
              return sortMode === "light-to-dark" ? lb - la : la - lb;
            });
      colorGrid.innerHTML = "";

      rows.forEach((color) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-preview" style="background:${color.hex};"></div>
          <h3 class="card-name">${color.name}</h3>
          <p class="card-hex">${color.hex}</p>
        `;
        colorGrid.appendChild(card);
      });
    }

    async function loadColors() {
      try {
        const response = await fetch(DATA_FILE);
        if (!response.ok) throw new Error("读取 colors.json 失败");
        const data = await response.json();
        if (!Array.isArray(data) || !data[0] || !Array.isArray(data[0].colors)) {
          throw new Error("colors.json 格式不正确");
        }
        colors = data[0].colors;
      } catch (error) {
        alert(`加载色卡失败：${error.message}`);
      }
      renderColors();
    }

    function closeFilterPanel() {
      filterPanel.hidden = true;
      filterBtn.setAttribute("aria-expanded", "false");
    }

    function toggleFilterPanel() {
      const open = filterPanel.hidden;
      filterPanel.hidden = !open;
      filterBtn.setAttribute("aria-expanded", String(open));
    }

    function syncFilterSwatchUi() {
      filterSwatches.querySelectorAll(".filter-swatch").forEach((btn) => {
        const id = btn.dataset.family;
        const on = selectedFamilies.has(id);
        btn.classList.toggle("is-selected", on);
        btn.setAttribute("aria-pressed", String(on));
      });
      filterBtn.classList.toggle("is-active", selectedFamilies.size > 0);
    }

    FAMILIES.forEach((f) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-swatch" + (f.light ? " filter-swatch--light" : "");
      btn.dataset.family = f.id;
      btn.title = f.label;
      btn.setAttribute("aria-label", `${f.label}色系`);
      btn.setAttribute("aria-pressed", "false");
      btn.style.background = f.swatch;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (selectedFamilies.has(f.id)) {
          selectedFamilies.delete(f.id);
        } else {
          selectedFamilies.add(f.id);
        }
        syncFilterSwatchUi();
        renderColors();
      });
      filterSwatches.appendChild(btn);
    });

    filterWrap.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    filterBtn.addEventListener("click", () => {
      toggleFilterPanel();
    });

    document.getElementById("filter-select-all").addEventListener("click", (e) => {
      e.stopPropagation();
      FAMILIES.forEach((f) => selectedFamilies.add(f.id));
      syncFilterSwatchUi();
      renderColors();
    });

    document.getElementById("filter-clear-all").addEventListener("click", (e) => {
      e.stopPropagation();
      selectedFamilies.clear();
      syncFilterSwatchUi();
      renderColors();
    });

    document.addEventListener("click", () => {
      closeFilterPanel();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeFilterPanel();
      }
    });

    document.getElementById("go-catalog-btn").addEventListener("click", () => {
      catalogSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    searchInput.addEventListener("input", (event) => {
      searchKeyword = event.target.value.trim().toLowerCase();
      renderColors();
    });

    const sortSelect = document.getElementById("sort-select");
    sortSelect.addEventListener("change", () => {
      const v = sortSelect.value;
      if (v === "light-to-dark" || v === "dark-to-light" || v === "default") {
        sortMode = v;
        renderColors();
      }
    });

    loadColors();
  </script>
</body>
</html>
